name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build distributions
        run: python -m build

      - name: Prepare stable assets
        run: |
          cp dist/*.whl dist/kx_agent-latest-py3-none-any.whl
          python scripts/release_manifest.py "${GITHUB_REF_NAME}"
          sha256sum dist/* release-manifest.json > SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            release-manifest.json
            SHA256SUMS.txt
          generate_release_notes: true
