[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinel-guard"
version = "0.1.0"
description = "AI网络安全智能体 — 纯防御型，7×24小时自主值守"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Sentinel Contributors"}
]
keywords = ["security", "ai", "cybersecurity", "ids", "monitoring", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
]

dependencies = [
    "litellm>=1.40.0",
    "aiohttp>=3.9.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "click>=8.0.0",
    "scapy>=2.5.0",
    "pyshark>=0.6.0",
    "watchfiles>=0.20.0",
    "apscheduler>=3.10.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]
dashboard = [
    "fastapi[standard]>=0.110.0",
    "websockets>=12.0",
]

[project.scripts]
sentinel = "sentinel_cli.main:cli"

[project.entry-points."sentinel.plugins"]
example = "plugins.example.main:SentinelPlugin"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.hatch.build.targets.wheel]
packages = ["sentinel_core", "sentinel_security", "sentinel_cli", "sentinel_dashboard", "sentinel_plugins"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
