[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kx-agent"
version = "0.3.0"
description = "KX Agent — local-first orchestration with memory, approvals, and operator control"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "KX Contributors"}
]
keywords = ["agent", "memory", "gateway", "skills", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
]

dependencies = [
    "litellm>=1.50.0",
    "openai>=1.0.0",
    "pyyaml>=6.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]
dashboard = [
    "fastapi[standard]>=0.110.0",
    "websockets>=12.0",
]

[project.scripts]
kx = "kx_agent.cli:cli"
sentinel = "kx_agent.cli:cli"

[project.entry-points."sentinel.plugins"]
example = "plugins.example.main:SentinelPlugin"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.hatch.build.targets.wheel]
packages = ["kx_agent", "sentinel_core", "sentinel_security", "sentinel_cli", "sentinel_dashboard", "sentinel_plugins"]

[tool.hatch.build.targets.wheel.force-include]
"kx_agent/dashboard_assets" = "kx_agent/dashboard_assets"

[tool.hatch.build.targets.sdist]
include = [
    "/kx_agent",
    "/tests",
    "/scripts",
    "/README.md",
    "/pyproject.toml",
    "/.env.example",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
