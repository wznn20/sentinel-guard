# ============================================================
# KX Agent — Docker Compose 快速部署
# ============================================================

version: "3.8"

services:
  kx-agent:
    image: ghcr.io/wznn20/sentinel-guard:latest
    container_name: kx-agent
    restart: unless-stopped

    # 网络模式:
    #   host: 流量分析需要抓包 (推荐)
    #   bridge: 不需要流量分析时
    network_mode: host

    volumes:
      - ~/.kx:/home/kx/.kx

    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - TZ=UTC

    # 资源限制
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

    # 健康检查
    healthcheck:
      test: ["CMD", "kx", "status", "--json"]
      interval: 30s
      timeout: 5s
      retries: 3
